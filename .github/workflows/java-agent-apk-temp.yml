name: Build Java Agent APK release asset

on:
  push:
    branches:
      - arena/373888c3-rea

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Java Agent
        working-directory: android-java-agent
        run: |
          bash scripts/setup-toolchain.sh
          bash scripts/test.sh
          bash scripts/build.sh
          cp java-agent-debug.apk Java-Agent.apk
          sha256sum Java-Agent.apk
      - name: Attach APK to the prerelease
        working-directory: android-java-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload java-agent-v1.0.0-debug Java-Agent.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Java-Agent-APK
          path: android-java-agent/Java-Agent.apk
          retention-days: 14
